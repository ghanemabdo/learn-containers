server {
  listen 8080;
  root /usr/share/nginx/html;
  proxy_ssl_server_name on;

  location = /feeds/bbc       { proxy_pass https://feeds.bbci.co.uk/news/rss.xml; }
  location = /feeds/npr       { proxy_pass https://feeds.npr.org/1001/rss.xml; }
  location = /feeds/guardian  { proxy_pass https://www.theguardian.com/world/rss; }
  location = /feeds/aljazeera { proxy_pass https://www.aljazeera.com/xml/rss/all.xml; }
}
